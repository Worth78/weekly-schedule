<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar background -->
  <rect x="8" y="12" width="48" height="44" rx="4" fill="url(#grad)"/>

  <!-- Calendar header -->
  <rect x="8" y="12" width="48" height="12" rx="4" fill="#fff" opacity="0.3"/>

  <!-- Calendar rings -->
  <rect x="16" y="8" width="4" height="8" rx="2" fill="#fff"/>
  <rect x="28" y="8" width="4" height="8" rx="2" fill="#fff"/>
  <rect x="40" y="8" width="4" height="8" rx="2" fill="#fff"/>

  <!-- Calendar grid dots -->
  <circle cx="18" cy="32" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="32" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="32" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="48" cy="32" r="2.5" fill="#fff" opacity="0.9"/>

  <circle cx="18" cy="42" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="42" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="42" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="48" cy="42" r="2.5" fill="#fff" opacity="0.9"/>

  <circle cx="18" cy="50" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="50" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="50" r="2.5" fill="#fff" opacity="0.9"/>

  <!-- Highlight dot (current day) -->
  <circle cx="48" cy="50" r="3.5" fill="#ed8936"/>
</svg>
