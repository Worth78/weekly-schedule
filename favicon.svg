<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar background -->
  <rect x="4" y="8" width="56" height="52" rx="6" fill="url(#grad)"/>

  <!-- Calendar header -->
  <rect x="4" y="8" width="56" height="16" rx="6" fill="#fff" opacity="0.3"/>

  <!-- Calendar rings -->
  <rect x="14" y="4" width="5" height="10" rx="2.5" fill="#fff"/>
  <rect x="29.5" y="4" width="5" height="10" rx="2.5" fill="#fff"/>
  <rect x="45" y="4" width="5" height="10" rx="2.5" fill="#fff"/>

  <!-- Calendar grid dots -->
  <circle cx="16" cy="32" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="32" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="32" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="52" cy="32" r="3.5" fill="#fff" opacity="0.9"/>

  <circle cx="16" cy="44" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="44" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="44" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="52" cy="44" r="3.5" fill="#fff" opacity="0.9"/>

  <circle cx="16" cy="54" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="54" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="54" r="3.5" fill="#fff" opacity="0.9"/>

  <!-- Highlight dot (current day) -->
  <circle cx="52" cy="54" r="4.5" fill="#ed8936"/>
</svg>
